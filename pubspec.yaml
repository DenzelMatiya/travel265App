name: travel265
description: "A comprehensive travel booking app with user authentication, calendar-based booking, and payment integration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ^3.16.0  # ADDED: Explicit Flutter version requirement

dependencies:
  # Core Flutter (ALWAYS at top)
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend & Authentication
  supabase_flutter: ^2.8.3
  google_sign_in: ^6.2.2

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # Utilities
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  uuid: ^4.5.0
  logger: ^2.0.2

  # UI & Media
  image_picker: ^1.0.8
  cached_network_image: ^3.4.0
  pin_code_fields: ^8.0.1
  table_calendar: ^3.1.0

  # Device & Permissions
  url_launcher: ^6.3.1
  permission_handler: ^11.3.0
  path_provider: ^2.1.4
  path: ^1.9.0
  # fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

